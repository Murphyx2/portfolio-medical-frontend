# Production nginx: serves built SPA, proxies /api and /media to the backend,
# and terminates TLS. Port 80 only exists to redirect to HTTPS (M-06).
upstream backend {
    server backend:8000;
}

# HTTP -> HTTPS redirect.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Matches the top of the admin-configurable max-image-upload range
    # (apps.systemsettings, 1-100 MB -- see RecordImageSerializer.
    # validate_image, which reads the live setting) so a value an admin sets
    # anywhere in that range gets Django's own validation message instead of
    # a bare nginx 413. Keep this at or above the top of that range whenever
    # either changes.
    client_max_body_size 100m;

    # Security headers (no HTML in /media/ responses, no framing, strict CSP).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) so clients cannot forge the IP the backend
        # logs for audit purposes.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Media is only served through Django's token-guarded ProtectedMediaView
    # (H-02). Requests without a valid signed token get a 404 from the backend.
    # The signed token rides in the query string, so media URLs must never be
    # written to access logs (M-04).
    location /media/ {
        access_log off;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Static assets are served by Django/whitenoise; nginx just needs to stop
    # routing them into the SPA catch-all below (I3).
    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Django admin: previously fell through to the SPA catch-all below and
    # was unreachable in prod -- needed for incident-time user unlock,
    # password reset, and AuditLog review (I3).
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
